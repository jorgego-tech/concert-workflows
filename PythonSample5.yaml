name: PythonSample5
platform: node
blocks:
  - action: system/FaaS/Python
    name: Python_1
    inputs:
      - name: code
        value: |-
          #!/usr/bin/env python3

          import argparse
          import requests
          import sys


          def create_github_issue(token, owner, repo, title, body=None, labels=None, assignees=None):
              """
              Create a GitHub issue using the REST API.

              :param token: GitHub Personal Access Token
              :param owner: Repository owner (user or organization)
              :param repo: Repository name
              :param title: Issue title
              :param body: Issue body (optional)
              :param labels: List of labels (optional)
              :param assignees: List of assignees (optional)
              :return: JSON response from GitHub
              """

              url = f"https://api.github.com/repos/{owner}/{repo}/issues"

              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28"
              }

              payload = {
                  "title": title
              }

              if body:
                  payload["body"] = body
              if labels:
                  payload["labels"] = labels
              if assignees:
                  payload["assignees"] = assignees

              try:
                  response = requests.post(url, headers=headers, json=payload, timeout=30)
              except requests.exceptions.RequestException as e:
                  print(f"❌ Network error: {e}")
                  sys.exit(1)

              if response.status_code == 201:
                  print("✅ Issue created successfully")
                  data = response.json()
                  print(f"Issue URL: {data.get('html_url')}")
                  return data
              else:
                  print("❌ Failed to create issue")
                  print(f"Status Code: {response.status_code}")
                  print(f"Response: {response.text}")
                  sys.exit(1)



          def main():

              create_github_issue(
                  token=token,
                  owner=owner,
                  repo=repo,
                  title=title,
                  body=body,
                  labels=labels,
                  assignees=assignees
              )


          if __name__ == "__main__":
              main()
        type: const
      - name: encoding
        value: '"utf-8"'
      - name: parameters
        value: |-
          {
              "token": $TOKEN,
              "owner": $OWNER,
              "repo": $REPO,
              "title": $TITLE,
              "body": $BODY,
              "labels": $LABELS,
              "assignees": $ASSIGNEES
          }
      - name: fullBuild
        value: "true"
      - name: requirements
        value: |-
          requests
          httpx
          pandas
        type: const
    breakpoint: enabled
  - action: assign
    name: Assign_1
    variable: $pythonresult
    value: $Python_1.result
